version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # vstd must match the Verus release used for the proofs.
      - dependency-name: vstd
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
