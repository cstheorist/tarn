name: Exact key contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: key-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  keys:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [memtx, vinyl]
        native: ["1", "0"]
    services:
      mysql:
        image: mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "1"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3408:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install PyMySQL==1.1.2 mysql-connector-python==9.5.0 tarantool==1.2.0
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache/restore@v6
        id: tarantool
        with:
          path: ~/.local/tarantool
          key: tarantool-3.9.0-${{ runner.os }}-${{ hashFiles('ci/install-tarantool.sh') }}
      - run: |
          ci/install-tarantool.sh 3.9.0 "$HOME/.local/tarantool"
          echo "$HOME/.local/tarantool/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/save@v6
        if: steps.tarantool.outputs.cache-hit != 'true'
        with:
          path: ~/.local/tarantool
          key: tarantool-3.9.0-${{ runner.os }}-${{ hashFiles('ci/install-tarantool.sh') }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --workspace
      - name: Retain exact build inputs
        run: |
          mkdir -p key-evidence
          git rev-parse HEAD > key-evidence/source.txt
          rustc -Vv > key-evidence/rustc.txt
          tarantool --version > key-evidence/tarantool.txt
          sha256sum target/release/tarn-server target/release/libtarn_storage.so > key-evidence/binaries.sha256
          pip freeze > key-evidence/python.txt
      - name: Start RF3 fsync cluster
        env:
          TARN_VINYL_MEMORY_MB: "64"
          TARN_VINYL_CACHE_MB: "0"
          TARN_BUCKET_COUNT: "256"
          TARN_CHECK_YIELDS: "1"
          TARN_CHECK_LOCKS: "1"
          TARN_TEST_HOOKS: "1"
          TARN_DUMP_EVERY: "2"
        run: |
          if [ '${{ matrix.native }}' = 0 ]; then export TARN_NATIVE=0; else export TARN_NATIVE="$PWD/target/release/libtarn_storage.so"; fi
          scripts/cluster.sh start -n 2 -r 3 -m 128 -w fsync -p 4180 -t 2 -e '${{ matrix.engine }}' -d "$RUNNER_TEMP/key-cluster"
      - name: Paired pinned-MySQL histories
        run: python3 tests/sql/key_semantics.py --tarn 127.0.0.1:4180 --ref 127.0.0.1:3408 --engine '${{ matrix.engine }}' --output key-evidence/paired.json
      - name: Exact keys through leader loss, movement and restart
        run: python3 tests/sql/key_semantics_faults.py --tarn 127.0.0.1:4180 --cluster-dir "$RUNNER_TEMP/key-cluster" --engine '${{ matrix.engine }}' --native '${{ matrix.native }}' --output key-evidence/faults.json
      - name: Export cluster and stop owned processes
        if: always()
        run: |
          mkdir -p key-evidence/cluster
          if [ -d "$RUNNER_TEMP/key-cluster" ]; then
            cp "$RUNNER_TEMP/key-cluster/cluster.json" "$RUNNER_TEMP/key-cluster/params" key-evidence/cluster/ || true
            cp "$RUNNER_TEMP/key-cluster/"*.log key-evidence/cluster/ || true
            KEEP=1 scripts/cluster.sh stop -d "$RUNNER_TEMP/key-cluster" || true
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: keys-${{ matrix.engine }}-native-${{ matrix.native }}-${{ github.run_id }}
          path: key-evidence/
          retention-days: 30
