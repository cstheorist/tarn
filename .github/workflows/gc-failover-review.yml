name: Native GC failover investigation

on:
  pull_request:
    paths:
      - '.github/workflows/gc-failover-review.yml'
      - 'scripts/gc_failover_review.py'
      - 'tests/test_gc_failover_review.py'
      - 'scripts/gc_upvalue_study.py'
      - 'tests/test_gc_upvalue_study.py'
      - 'tests/gc_upvalue.lua'
      - 'scripts/gc_trace_coverage.py'
      - 'tests/test_gc_trace_coverage.py'
      - 'scripts/gc_upstream_control.py'
      - 'tests/test_gc_upstream_control.py'
      - 'tests/gc-upvalue/**'
      - 'tests/gc-effects.sh'
      - 'tests/gc-effects/**'
      - 'tests/sql/gc_effects.py'
      - 'tests/sql/effect_journal.py'
      - 'tests/test_gc_effects.py'
      - 'tests/test_effect_journal.py'
      - 'tests/outcome_proxy.py'
      - 'tests/test_outcome_proxy.py'
      - 'ci/install-gc-runtime.sh'
      - 'ci/gc-runtime/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnostic experiment
        type: choice
        options: [failover, upvalue, coverage, effects, blocked, upstream]
        default: failover
      iterations:
        description: Iterations per upvalue trial (1-1000000)
        type: string
        default: '20000'
      trials:
        description: Fresh processes per upvalue profile (1-10)
        type: string
        default: '3'

permissions:
  contents: read
  actions: read

concurrency:
  group: gc-review-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'pr' }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.98.1'
  TARANTOOL_VERSION: '3.9.0'

defaults:
  run:
    shell: bash

jobs:
  upvalue-controls:
    name: Upvalue evidence negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -B tests/test_gc_upvalue_study.py
      - run: python3 -B tests/test_gc_trace_coverage.py
      - run: python3 -B tests/test_gc_upstream_control.py
      - run: python3 -B tests/test_effect_journal.py
      - run: python3 -B tests/test_gc_effects.py
      - run: python3 -m pip install msgpack==1.1.2
      - run: python3 -B tests/test_outcome_proxy.py
      - run: bash -n ci/install-gc-runtime.sh
      - run: bash -n tests/gc-effects.sh

  effects:
    name: Exact effects after owned process loss
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'effects'
    needs: upvalue-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reuse audited unpatched runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gc-upvalue-baseline-41764862465-1
          run-id: 41764862465
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/audited-runtime
      - name: Verify runtime and install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libunwind-dev libreadline-dev libicu-dev libssl-dev libncurses-dev
          python3 -m pip install PyMySQL==1.1.2 mysql-connector-python==9.5.0 msgpack==1.1.2
          PYTHONPATH=scripts python3 -B - <<'PY'
          import os
          from pathlib import Path
          from gc_trace_coverage import verify_audited_runtime
          runtime = Path(os.environ['RUNNER_TEMP']) / 'audited-runtime/upvalue-runtime'
          verify_audited_runtime(runtime, 'baseline', Path('ci/gc-runtime/urefo-x86.patch'))
          PY
          chmod +x "$RUNNER_TEMP/audited-runtime/upvalue-runtime/bin/tarantool"
          echo "TARANTOOL=$RUNNER_TEMP/audited-runtime/upvalue-runtime/bin/tarantool" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/audited-runtime/upvalue-runtime/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/effects-binaries" "$RUNNER_TEMP/effects-evidence"
          echo "GC_EVIDENCE_PARENT=$RUNNER_TEMP/effects-evidence" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: gc-effects
      - name: Build and bind unchanged release gateway and native module
        id: build
        run: |
          cargo build --release --locked -p tarn-server -p tarn-storage 2>&1 | tee "$RUNNER_TEMP/effects-binaries/build.log"
          cp target/release/tarn-server target/release/libtarn_storage.so "$RUNNER_TEMP/effects-binaries/"
          python3 -B scripts/gc_failover_review.py bind --source . --output "$RUNNER_TEMP/effects-binaries"
      - name: memtx with native procedures enabled
        if: always() && steps.build.outcome == 'success'
        run: ENGINE=memtx GC_NATIVE=native GC_BASE=7200 GC_PORT=7300 GC_RECOVERY_PORT=7301 GC_PROXY_PORT=7240 bash tests/gc-effects.sh
      - name: memtx with native procedures disabled
        if: always() && steps.build.outcome == 'success'
        run: ENGINE=memtx GC_NATIVE=off GC_BASE=7400 GC_PORT=7500 GC_RECOVERY_PORT=7501 GC_PROXY_PORT=7440 bash tests/gc-effects.sh
      - name: Vinyl with native procedures enabled
        if: always() && steps.build.outcome == 'success'
        run: ENGINE=vinyl GC_NATIVE=native GC_BASE=7600 GC_PORT=7700 GC_RECOVERY_PORT=7701 GC_PROXY_PORT=7640 bash tests/gc-effects.sh
      - name: Vinyl with native procedures disabled
        if: always() && steps.build.outcome == 'success'
        run: ENGINE=vinyl GC_NATIVE=off GC_BASE=7800 GC_PORT=7900 GC_RECOVERY_PORT=7901 GC_PROXY_PORT=7840 bash tests/gc-effects.sh
      - name: Retain complete effects and runtime evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gc-effects-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/effects-evidence
            ${{ runner.temp }}/effects-binaries
            ${{ runner.temp }}/audited-runtime/upvalue-runtime
          retention-days: 30
          if-no-files-found: error

  coverage:
    name: Audited runtime diagnostic / ${{ matrix.arm }}
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'coverage' || inputs.mode == 'blocked' || inputs.mode == 'upstream')
    needs: upvalue-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [baseline, candidate]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      STUDY_ARM: ${{ matrix.arm }}
      STUDY_ITERATIONS: ${{ inputs.iterations }}
      STUDY_TRIALS: ${{ inputs.trials }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download the independently audited runtime pair
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gc-upvalue-${{ matrix.arm }}-41764862465-1
          run-id: 41764862465
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/audited-runtime
      - name: Install runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libunwind-dev libreadline-dev libicu-dev libssl-dev libncurses-dev
      - name: Observe bounded compilation using the same verified binaries
        if: inputs.mode == 'coverage'
        run: |
          chmod +x "$RUNNER_TEMP/audited-runtime/upvalue-runtime/bin/tarantool"
          python3 -B scripts/gc_trace_coverage.py --source "$GITHUB_WORKSPACE" \
            --runtime "$RUNNER_TEMP/audited-runtime/upvalue-runtime" --arm "$STUDY_ARM" \
            --output "$RUNNER_TEMP/trace-coverage"
      - name: Keep rebuild blocked during repeated invalidation
        if: inputs.mode == 'blocked'
        run: |
          PYTHONPATH=scripts python3 -B - <<'PY'
          import os
          from pathlib import Path
          from gc_trace_coverage import verify_audited_runtime
          runtime = Path(os.environ['RUNNER_TEMP']) / 'audited-runtime/upvalue-runtime'
          verify_audited_runtime(runtime, os.environ['STUDY_ARM'], Path('ci/gc-runtime/urefo-x86.patch'))
          PY
          chmod +x "$RUNNER_TEMP/audited-runtime/upvalue-runtime/bin/tarantool"
          mkdir -p "$RUNNER_TEMP/blocked-cores"
          cat /proc/sys/kernel/core_pattern > "$RUNNER_TEMP/blocked-core-pattern-before.txt"
          sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/blocked-cores/core.%e.%p"
          ulimit -c unlimited
          python3 -B scripts/gc_upvalue_study.py --source "$GITHUB_WORKSPACE" \
            --runtime "$RUNNER_TEMP/audited-runtime/upvalue-runtime" --arm "$STUDY_ARM" \
            --output "$RUNNER_TEMP/blocked-study" --core-dir "$RUNNER_TEMP/blocked-cores" \
            --iterations "$STUDY_ITERATIONS" --trials "$STUDY_TRIALS" --timeout 60 \
            --profiles retained-blocked-rebuild retained-blocked-rebuild-incremental-gc \
              retained-blocked-rebuild-incremental-gc-jit-off
      - name: Run the fixed upstream functional control batch
        if: inputs.mode == 'upstream'
        run: |
          chmod +x "$RUNNER_TEMP/audited-runtime/upvalue-runtime/bin/tarantool"
          python3 -B scripts/gc_upstream_control.py --source "$GITHUB_WORKSPACE" \
            --runtime "$RUNNER_TEMP/audited-runtime/upvalue-runtime" --arm "$STUDY_ARM" \
            --output "$RUNNER_TEMP/upstream-control"
      - name: Retain every observation and the reused runtime identities
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gc-${{ inputs.mode }}-${{ matrix.arm }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/trace-coverage
            ${{ runner.temp }}/blocked-study
            ${{ runner.temp }}/blocked-cores
            ${{ runner.temp }}/blocked-core-pattern-before.txt
            ${{ runner.temp }}/upstream-control
            ${{ runner.temp }}/audited-runtime/upvalue-runtime/bin
            ${{ runner.temp }}/audited-runtime/upvalue-runtime/runtime-receipt.json
            ${{ runner.temp }}/audited-runtime/upvalue-runtime/inputs
            ${{ runner.temp }}/audited-runtime/upvalue-runtime/logs
            ${{ runner.temp }}/audited-runtime/upvalue-runtime/CMakeCache.txt
          retention-days: 30
          if-no-files-found: error

  upvalue:
    name: Functional runtime experiment / ${{ matrix.arm }}
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'upvalue'
    needs: upvalue-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [baseline, candidate]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GC_RUNTIME_JOBS: '2'
      STUDY_ARM: ${{ matrix.arm }}
      STUDY_ITERATIONS: ${{ inputs.iterations }}
      STUDY_TRIALS: ${{ inputs.trials }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install isolated runtime build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake autoconf automake libtool git \
            zlib1g-dev libreadline-dev libncurses-dev libssl-dev libicu-dev libunwind-dev
      - name: Build pinned runtime and bind source and binary identities
        run: bash ci/install-gc-runtime.sh "$STUDY_ARM" "$RUNNER_TEMP/upvalue-runtime"
      - name: Configure core capture on this isolated runner
        run: |
          mkdir -p "$RUNNER_TEMP/upvalue-cores"
          cat /proc/sys/kernel/core_pattern > "$RUNNER_TEMP/core-pattern-before.txt"
          sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/upvalue-cores/core.%e.%p"
      - name: Run finite functional observations with unchanged engine
        run: |
          ulimit -c unlimited
          python3 -B scripts/gc_upvalue_study.py --source "$GITHUB_WORKSPACE" \
            --runtime "$RUNNER_TEMP/upvalue-runtime" --arm "$STUDY_ARM" \
            --output "$RUNNER_TEMP/upvalue-study" --core-dir "$RUNNER_TEMP/upvalue-cores" \
            --iterations "$STUDY_ITERATIONS" --trials "$STUDY_TRIALS" --timeout 60
      - name: Retain runtime inputs and every observation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gc-upvalue-${{ matrix.arm }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/upvalue-runtime/bin
            ${{ runner.temp }}/upvalue-runtime/runtime-receipt.json
            ${{ runner.temp }}/upvalue-runtime/inputs
            ${{ runner.temp }}/upvalue-runtime/logs
            ${{ runner.temp }}/upvalue-runtime/CMakeCache.txt
            ${{ runner.temp }}/upvalue-study
            ${{ runner.temp }}/upvalue-cores
            ${{ runner.temp }}/core-pattern-before.txt
          retention-days: 30
          if-no-files-found: error

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'failover'
    name: Pinned release (${{ matrix.revision }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        revision: [observed, current]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          ref: ${{ matrix.revision == 'observed' && '420bde9fa9393c847cf022d4230b233c49b01fa7' || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target
          key: gc-review-${{ matrix.revision }}
      - name: Build the unchanged release profile and bind artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/binaries"
          cd source
          cargo build --release --locked -p tarn-server -p tarn-storage 2>&1 | tee "$RUNNER_TEMP/binaries/build.log"
          cp target/release/tarn-server target/release/libtarn_storage.so "$RUNNER_TEMP/binaries/"
          python3 ../harness/scripts/gc_failover_review.py bind --source . --output "$RUNNER_TEMP/binaries"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gc-build-${{ matrix.revision }}-${{ github.run_id }}
          path: ${{ runner.temp }}/binaries
          retention-days: 30
          if-no-files-found: error

  investigate:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'failover'
    name: ${{ matrix.revision }} / ${{ matrix.engine }} / ${{ matrix.mode }} / JIT ${{ matrix.jit }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {revision: observed, engine: vinyl, mode: native, jit: 'on'}
          - {revision: observed, engine: vinyl, mode: lua, jit: 'on'}
          - {revision: observed, engine: vinyl, mode: native, jit: 'off'}
          - {revision: current, engine: vinyl, mode: native, jit: 'on'}
          - {revision: current, engine: memtx, mode: native, jit: 'on'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          ref: ${{ matrix.revision == 'observed' && '420bde9fa9393c847cf022d4230b233c49b01fa7' || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gc-build-${{ matrix.revision }}-${{ github.run_id }}
          path: ${{ runner.temp }}/binaries
      - name: Restore pinned Tarantool
        id: tarantool-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/tarantool
          key: tarantool-3.9.0-${{ runner.os }}-${{ hashFiles('harness/ci/install-tarantool.sh') }}
      - name: Install Tarantool and SQL driver
        run: |
          harness/ci/install-tarantool.sh "$TARANTOOL_VERSION" "$HOME/.local/tarantool"
          echo "$HOME/.local/tarantool/bin" >> "$GITHUB_PATH"
          python3 -m pip install PyMySQL
          chmod +x "$RUNNER_TEMP/binaries/tarn-server"
      - name: Save pinned Tarantool
        if: steps.tarantool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.local/tarantool
          key: tarantool-3.9.0-${{ runner.os }}-${{ hashFiles('harness/ci/install-tarantool.sh') }}
      - name: Collector controls
        run: python3 harness/tests/test_gc_failover_review.py
      - name: Capture future crash cores on this isolated runner
        run: |
          mkdir -p "$RUNNER_TEMP/gc-cores"
          cat /proc/sys/kernel/core_pattern > "$RUNNER_TEMP/core-pattern-before.txt"
          sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/gc-cores/core.%e.%p"
      - name: Three complete failover trials with original accounting
        run: |
          ulimit -c unlimited
          python3 harness/scripts/gc_failover_review.py run \
            --source source --binaries "$RUNNER_TEMP/binaries" --output "$RUNNER_TEMP/gc-review" \
            --engine '${{ matrix.engine }}' --mode '${{ matrix.mode }}' --jit '${{ matrix.jit }}' \
            --repetitions 3 --seconds 45 --timeout 360
      - name: Preserve runtime binary and compress crash cores
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/runtime"
          cp "$HOME/.local/tarantool/bin/tarantool" "$RUNNER_TEMP/runtime/"
          sha256sum "$RUNNER_TEMP/runtime/tarantool" > "$RUNNER_TEMP/runtime/SHA256SUMS"
          tar -czf "$RUNNER_TEMP/crash-cores.tar.gz" -C "$RUNNER_TEMP" gc-cores core-pattern-before.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gc-${{ matrix.revision }}-${{ matrix.engine }}-${{ matrix.mode }}-${{ matrix.jit }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gc-review
            !${{ runner.temp }}/gc-review/trial-*/cluster/s*.*/*
            !${{ runner.temp }}/gc-review/trial-*/cluster/s*.*/*/**
            ${{ runner.temp }}/runtime
            ${{ runner.temp }}/crash-cores.tar.gz
          retention-days: 30
          compression-level: 1
          if-no-files-found: error
