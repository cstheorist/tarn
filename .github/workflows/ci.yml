name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"        # keep in sync with rust-toolchain.toml
  TARANTOOL_VERSION: "3.9.0"
  VERUS_VERSION: "0.2026.10.04.426d8b0"
  TLA_TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      # Reference server for the SQL differential tests.
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
        ports:
          - 3407:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install PyMySQL
      # Restore and save separately, so that the (slow) Tarantool build is
      # cached even when a later step fails.
      - name: Restore Tarantool
        id: tarantool-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/tarantool
          key: tarantool-${{ env.TARANTOOL_VERSION }}-${{ runner.os }}-${{ hashFiles('ci/install-tarantool.sh') }}
      - name: Install Tarantool
        run: |
          ci/install-tarantool.sh "$TARANTOOL_VERSION" "$HOME/.local/tarantool"
          echo "$HOME/.local/tarantool/bin" >> "$GITHUB_PATH"
      - name: Save Tarantool
        if: steps.tarantool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.local/tarantool
          key: tarantool-${{ env.TARANTOOL_VERSION }}-${{ runner.os }}-${{ hashFiles('ci/install-tarantool.sh') }}
      - name: Create the MariaDB test user
        run: mysql -h 127.0.0.1 -P 3407 -u root -e "CREATE USER 'sb'@'%' IDENTIFIED BY ''; GRANT ALL ON *.* TO 'sb'@'%';"
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace --all-targets
      - name: Unit and IPROTO integration tests
        run: cargo test --release --workspace
      - name: Storage protocol tests
        run: ci/annotate.sh storage lua/test/run.sh
      - name: Storage protocol tests without the native procedures
        run: TARN_NATIVE=0 ci/annotate.sh storage-lua lua/test/run.sh
      - name: Start a 2-shard cluster (two SQL servers)
        run: TARN_TEST_HOOKS=1 TARN_CHECK_LOCKS=1 scripts/cluster.sh start -n 2 -r 1 -p 4000 -s 2
      - name: SQL differential tests against MariaDB 10.11
        run: |
          ci/annotate.sh difftest python3 tests/sql/difftest.py --tarn 127.0.0.1:4000 --ref 127.0.0.1:3407
          ci/annotate.sh fuzzdiff python3 tests/sql/fuzzdiff.py --tarn 127.0.0.1:4000 --ref 127.0.0.1:3407 -n 1000
      - name: Transaction tests
        run: ci/annotate.sh txntest python3 tests/sql/txntest.py --tarn 127.0.0.1:4000 --kv 127.0.0.1:3311,127.0.0.1:3321 --bank-seconds 15
      - name: READ COMMITTED tests
        run: ci/annotate.sh rctest python3 tests/sql/rctest.py --tarn 127.0.0.1:4000,127.0.0.1:4001
      - name: Schema changes and dumps
        run: ci/annotate.sh ddltest python3 tests/sql/ddltest.py --tarn 127.0.0.1:4000,127.0.0.1:4001 --kv 127.0.0.1:3311,127.0.0.1:3321 --seconds 20
      - name: Lazy-index semantics and own-commit recovery
        run: |
          ci/annotate.sh lazytest python3 tests/sql/lazytest.py --tarn 127.0.0.1:4000 --kv 127.0.0.1:3311,127.0.0.1:3321 --ref 127.0.0.1:3407
          ci/annotate.sh lazyfaults python3 tests/sql/lazyfaults.py --tarn 127.0.0.1:4000 --shards 127.0.0.1:3311,127.0.0.1:3321
      - name: Bucket moves under load
        run: ci/annotate.sh movetest python3 tests/sql/movetest.py --tarn 127.0.0.1:4000,127.0.0.1:4001 --seconds 20
      - name: The native module's copy of the lock index held what the index held
        run: |
          if grep -h "lock copy differs" /tmp/tarn-cluster/*.log; then
            echo "::error title=locks::the native module's copy of the lock index differed from it"; exit 1
          fi
      - name: The same suites with vinyl tables, read from disk
        run: |
          scripts/cluster.sh stop
          TARN_VINYL_CACHE_MB=0 TARN_DUMP_EVERY=2 TARN_CHECK_YIELDS=1 TARN_TEST_HOOKS=1 TARN_CHECK_LOCKS=1 \
            scripts/cluster.sh start -n 2 -r 1 -p 4000 -s 2 -e vinyl
          # (moves first: with the tables the other suites leave, which every
          # move reads from disk, a runner moves too few buckets to tell)
          ci/annotate.sh vinyl-movetest python3 tests/sql/movetest.py --tarn 127.0.0.1:4000,127.0.0.1:4001 --seconds 30
          ci/annotate.sh vinyl-difftest python3 tests/sql/difftest.py --tarn 127.0.0.1:4000 --ref 127.0.0.1:3407
          ci/annotate.sh vinyl-txntest python3 tests/sql/txntest.py --tarn 127.0.0.1:4000 --kv 127.0.0.1:3311,127.0.0.1:3321 --bank-seconds 15
          ci/annotate.sh vinyl-rctest python3 tests/sql/rctest.py --tarn 127.0.0.1:4000,127.0.0.1:4001
          ci/annotate.sh vinyl-ddltest python3 tests/sql/ddltest.py --tarn 127.0.0.1:4000,127.0.0.1:4001 --kv 127.0.0.1:3311,127.0.0.1:3321 --seconds 20
          ci/annotate.sh vinyl-lazytest python3 tests/sql/lazytest.py --tarn 127.0.0.1:4000 --kv 127.0.0.1:3311,127.0.0.1:3321 --ref 127.0.0.1:3407 --engine vinyl
          ci/annotate.sh vinyl-lazyfaults python3 tests/sql/lazyfaults.py --tarn 127.0.0.1:4000 --shards 127.0.0.1:3311,127.0.0.1:3321 --engine vinyl
          if grep -h "yielded inside" /tmp/tarn-cluster/*.log; then echo "::error title=vinyl::an atomic section yielded"; exit 1; fi
          if grep -h "lock copy differs" /tmp/tarn-cluster/*.log; then
            echo "::error title=locks::the native module's copy of the lock index differed from it"; exit 1
          fi
      - name: Vinyl admission and overload latency
        run: |
          scripts/cluster.sh stop
          TARN_VINYL_MEMORY_MB=8 TARN_VINYL_CACHE_MB=0 TARN_VINYL_TIMEOUT=0.25 TARN_TEST_HOOKS=1 \
            scripts/cluster.sh start -n 2 -r 1 -p 4000 -s 2
          ci/annotate.sh vinylpressure python3 tests/sql/vinylpressure.py \
            --tarn 127.0.0.1:4000,127.0.0.1:4001 --shards 127.0.0.1:3311,127.0.0.1:3321 \
            --require-native --real-pressure
          scripts/cluster.sh stop
      - name: Fault injection
        run: |
          ci/annotate.sh faults tests/faults.sh
          TARN_NATIVE=0 ci/annotate.sh faults-lua tests/faults.sh
          ci/annotate.sh ddlfaults tests/ddlfaults.sh
          ci/annotate.sh movefaults tests/movefaults.sh
          ci/annotate.sh joinfaults tests/joinfaults.sh
      - name: Bucket count of new and older clusters
        run: ci/annotate.sh bucketcount tests/bucketcount.sh
      - name: A shard joins under load
        run: |
          ci/annotate.sh jointest tests/jointest.sh
          R=3 ENGINE=vinyl DIR=/tmp/tarn-join-vinyl ci/annotate.sh vinyl-jointest tests/jointest.sh
      - name: Grow from 2 shards to 4 and shrink to 3 under load
        run: SECS=45 ci/annotate.sh growshrink tests/growshrink.sh
      - name: Failover (2 shards x 3 replicas)
        run: SECS=45 TARN_CHECK_LOCKS=1 ci/annotate.sh failover tests/failover.sh
      - name: Fault injection and failover with vinyl tables
        run: |
          ENGINE=vinyl ci/annotate.sh vinyl-faults tests/faults.sh
          ENGINE=vinyl SECS=45 TARN_CHECK_LOCKS=1 DIR=/tmp/tarn-failover-vinyl ci/annotate.sh vinyl-failover tests/failover.sh
      - name: Cluster logs
        if: failure()
        run: |
          for f in /tmp/tarn-cluster/*.log /tmp/tarn-cluster/*/*.log /tmp/tarn-failover*/*.log /tmp/tarn-failover*/*/*.log /tmp/tarn-ddlfaults/*.log /tmp/tarn-movefaults/*.log /tmp/tarn-bucketcount/*.log /tmp/tarn-join*/*.log /tmp/tarn-growshrink/*.log; do
            [ -f "$f" ] && { echo "::group::$f"; tail -n 60 "$f"; echo "::endgroup::"; }
          done
          for f in /tmp/tarn-lazyfaults-*/manifest.json /tmp/tarn-lazyfaults-*/events.jsonl; do
            [ -f "$f" ] && { echo "::group::$f"; tail -n 60 "$f"; echo "::endgroup::"; }
          done
          for f in /tmp/tarn-vinylpressure-*/manifest.json /tmp/tarn-vinylpressure-*/events.jsonl /tmp/tarn-vinylpressure-*/pressure-summary.json; do
            [ -f "$f" ] && { echo "::group::$f"; tail -n 60 "$f"; echo "::endgroup::"; }
          done
          true

  tla:
    name: TLA+ model checking
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Download the TLA+ tools
        run: curl -fsSL -o tla/tla2tools.jar "$TLA_TOOLS_URL"
      - name: Check the fast configurations
        run: WORKERS=auto tla/check.sh

  verus:
    name: Verus proofs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust toolchain of the Verus release
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Download Verus
        run: |
          curl -fsSL -o verus.zip "https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q verus.zip -d "$HOME/verus"
      - name: Verify
        working-directory: crates/tarn-verified
        run: |
          "$HOME/verus/verus-x86-linux/verus" --crate-type=lib src/lib.rs 2>&1 | tee verus.log
          grep -qE "verification results:: [0-9]+ verified, 0 errors" verus.log
