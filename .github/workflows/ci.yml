name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      file_backup_scale:
        description: Include the file-backup scale study
        type: boolean
        default: false
      backup_size_gib:
        description: File-backup study payload GiB
        type: string
        default: '2'
      strong_read_cost:
        description: Run only the manual matched strong-read cost study
        type: boolean
        default: false
      topology_only:
        description: Run only the matched gateway topology scale study
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.topology_only && 'topology' || (github.event_name == 'workflow_dispatch' && inputs.strong_read_cost && 'cost' || 'ci') }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.strong_read_cost) }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"        # keep in sync with rust-toolchain.toml
  TARANTOOL_VERSION: "3.9.0"
  VERUS_VERSION: "0.2026.10.04.426d8b0"
  TLA_TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar

defaults:
  run:
    shell: bash

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch' || (!inputs.strong_read_cost && !inputs.topology_only)
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Native allocation instrumentation clippy
        run: cargo clippy -p tarn-storage --features alloc-metrics --all-targets -- -D warnings

  test:
    if: github.event_name != 'workflow_dispatch' || (!inputs.strong_read_cost && !inputs.topology_only)
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARN_QUERY_PUSHDOWN: 'true'
    services:
      mysql:
        image: mysql:8.4.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3408:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      # Reference server for the SQL differential tests.
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
        ports:
          - 3407:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install PyMySQL==1.1.2 mysql-connector-python==9.5.0
      - name: Vinyl pressure scheduling and readback controls
        run: python3 tests/sql/vinylpressure_phase_test.py
      # Restore and save separately, so that the (slow) Tarantool build is
      # cached even when a later step fails.
      - name: Restore Tarantool
        id: tarantool-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/tarantool
          key: tarantool-${{ env.TARANTOOL_VERSION }}-${{ runner.os }}-${{ hashFiles('ci/install-tarantool.sh') }}
      - name: Install Tarantool
        run: |
          ci/install-tarantool.sh "$TARANTOOL_VERSION" "$HOME/.local/tarantool"
          echo "$HOME/.local/tarantool/bin" >> "$GITHUB_PATH"
      - name: Save Tarantool
        if: steps.tarantool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.local/tarantool
          key: tarantool-${{ env.TARANTOOL_VERSION }}-${{ runner.os }}-${{ hashFiles('ci/install-tarantool.sh') }}
      - name: Create the MariaDB test user
        run: mysql -h 127.0.0.1 -P 3407 -u root -e "CREATE USER 'sb'@'%' IDENTIFIED BY ''; GRANT ALL ON *.* TO 'sb'@'%';"
      - name: Create the pinned MySQL integrity reference user
        run: |
          python3 - <<'PY'
          import pymysql
          with pymysql.connect(host='127.0.0.1',port=3408,user='root',password='',autocommit=True) as c:
              with c.cursor() as q:
                  q.execute("CREATE USER 'sb'@'%' IDENTIFIED BY ''")
                  q.execute("GRANT ALL ON *.* TO 'sb'@'%'")
          PY
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace --all-targets
      - name: Unit and IPROTO integration tests
        run: cargo test --release --workspace
      - name: Strong KV example and benchmark codec tests
        run: |
          cargo test --release -p tarn-sql --example strong_kv
          cargo test --release -p tarn-sql --example strong_kv_bench
      - name: Native allocation instrumentation units
        run: cargo test -p tarn-storage --features alloc-metrics --lib
      - name: Storage protocol tests
        run: TARN_NATIVE="$PWD/target/release/libtarn_storage.so" ci/annotate.sh storage lua/test/run.sh
      - name: Storage protocol tests without the native procedures
        run: TARN_NATIVE=0 ci/annotate.sh storage-lua lua/test/run.sh
      - name: File backup, restore and seeded replicas
        run: |
          python3 tests/test_backup.py
          TARN_NATIVE="$PWD/target/release/libtarn_storage.so" python3 tests/backup.py --work /tmp/tarn-backup-native --output /tmp/tarn-backup-native.json --functional --repetitions 1
          TARN_NATIVE=0 python3 tests/backup.py --work /tmp/tarn-backup-lua --output /tmp/tarn-backup-lua.json --functional --repetitions 1
      - name: Cluster-consistent backup and isolated restore
        run: |
          python3 tests/test_cluster_backup.py
          tarantool tests/test_fixture_retry.lua "$PWD/tests/fixture_retry.lua"
          for engine in memtx vinyl; do
            for mode in native lua; do
              native="$PWD/target/release/libtarn_storage.so"
              [ "$mode" != lua ] || native=0
              TARN_NATIVE="$native" python3 tests/cluster_backup.py \
                --work "/tmp/tarn-cluster-backup-$engine-$mode" --engine "$engine" \
                --output "/tmp/tarn-cluster-backup-$engine-$mode.json"
            done
          done
      - name: Decision placement, lost PREPARE reply and coordinator crash
        run: |
          ci/annotate.sh decision bash tests/decision.sh
          TARN_NATIVE=0 ci/annotate.sh decision-lua bash tests/decision.sh
          ENGINE=vinyl ci/annotate.sh decision-vinyl bash tests/decision.sh
      - name: Start a 2-shard cluster (two SQL servers)
        run: TARN_TEST_HOOKS=1 TARN_CHECK_LOCKS=1 scripts/cluster.sh start -n 2 -r 1 -p 4000 -s 2
      - name: SQL differential tests against MariaDB 10.11
        run: |
          ci/annotate.sh difftest python3 tests/sql/difftest.py --tarn 127.0.0.1:4000 --ref 127.0.0.1:3407
          ci/annotate.sh pushdowntest python3 tests/sql/pushdowntest.py --tarn 127.0.0.1:4000 --ref 127.0.0.1:3407
          ci/annotate.sh fuzzdiff python3 tests/sql/fuzzdiff.py --tarn 127.0.0.1:4000 --ref 127.0.0.1:3407 -n 1000
      - name: Integrity declarations and supported SQL mutations
        run: |
          mkdir -p integrity-evidence
          ci/annotate.sh integrity-mysql python3 tests/sql/integritytest.py --tarn 127.0.0.1:4000 --ref 127.0.0.1:3408 --reference mysql --kv 127.0.0.1:3311,127.0.0.1:3321 --output integrity-evidence/native-mysql.json
          ci/annotate.sh integrity-mariadb python3 tests/sql/integritytest.py --tarn 127.0.0.1:4000 --ref 127.0.0.1:3407 --reference mariadb --output integrity-evidence/native-mariadb.json
      - name: Query plans and bounded routing diagnostics
        run: ci/annotate.sh explaintest python3 tests/sql/explaintest.py --tarn 127.0.0.1:4000
      - name: Bounded statistics and inner-join reordering
        run: ci/annotate.sh statisticstest python3 tests/sql/statisticstest.py --tarn 127.0.0.1:4000,127.0.0.1:4001
      - name: Transaction tests
        run: ci/annotate.sh txntest python3 tests/sql/txntest.py --tarn 127.0.0.1:4000 --kv 127.0.0.1:3311,127.0.0.1:3321 --bank-seconds 15
      - name: READ COMMITTED tests
        run: ci/annotate.sh rctest python3 tests/sql/rctest.py --tarn 127.0.0.1:4000,127.0.0.1:4001
      - name: Query resource bounds and overload
        run: TARN_RESOURCE_REF=127.0.0.1:3407 ci/annotate.sh resources tests/resources.sh
      - name: Schema changes and dumps
        run: ci/annotate.sh ddltest python3 tests/sql/ddltest.py --tarn 127.0.0.1:4000,127.0.0.1:4001 --kv 127.0.0.1:3311,127.0.0.1:3321 --seconds 20
      - name: Lazy-index semantics and own-commit recovery
        run: |
          ci/annotate.sh lazytest python3 tests/sql/lazytest.py --tarn 127.0.0.1:4000 --kv 127.0.0.1:3311,127.0.0.1:3321 --ref 127.0.0.1:3407
          ci/annotate.sh lazyfaults python3 tests/sql/lazyfaults.py --tarn 127.0.0.1:4000 --shards 127.0.0.1:3311,127.0.0.1:3321
      - name: Bucket moves under load
        run: ci/annotate.sh movetest python3 tests/sql/movetest.py --tarn 127.0.0.1:4000,127.0.0.1:4001 --seconds 20
      - name: The native module's copy of the lock index held what the index held
        run: |
          if grep -h "lock copy differs" /tmp/tarn-cluster/*.log; then
            echo "::error title=locks::the native module's copy of the lock index differed from it"; exit 1
          fi
      - name: The same suites with vinyl tables, read from disk
        run: |
          scripts/cluster.sh stop
          TARN_VINYL_CACHE_MB=0 TARN_DUMP_EVERY=2 TARN_CHECK_YIELDS=1 TARN_TEST_HOOKS=1 TARN_CHECK_LOCKS=1 \
            scripts/cluster.sh start -n 2 -r 1 -p 4000 -s 2 -e vinyl
          # (moves first: with the tables the other suites leave, which every
          # move reads from disk, a runner moves too few buckets to tell)
          ci/annotate.sh vinyl-movetest python3 tests/sql/movetest.py --tarn 127.0.0.1:4000,127.0.0.1:4001 --seconds 30
          ci/annotate.sh vinyl-difftest python3 tests/sql/difftest.py --tarn 127.0.0.1:4000 --ref 127.0.0.1:3407
          ci/annotate.sh vinyl-pushdowntest python3 tests/sql/pushdowntest.py --tarn 127.0.0.1:4000 --ref 127.0.0.1:3407
          ci/annotate.sh integrity-vinyl python3 tests/sql/integritytest.py --tarn 127.0.0.1:4000 --ref 127.0.0.1:3408 --reference mysql --kv 127.0.0.1:3311,127.0.0.1:3321 --output integrity-evidence/vinyl-mysql.json
          ci/annotate.sh vinyl-explaintest python3 tests/sql/explaintest.py --tarn 127.0.0.1:4000
          ci/annotate.sh vinyl-statisticstest python3 tests/sql/statisticstest.py --tarn 127.0.0.1:4000,127.0.0.1:4001
          ci/annotate.sh vinyl-txntest python3 tests/sql/txntest.py --tarn 127.0.0.1:4000 --kv 127.0.0.1:3311,127.0.0.1:3321 --bank-seconds 15
          ci/annotate.sh vinyl-rctest python3 tests/sql/rctest.py --tarn 127.0.0.1:4000,127.0.0.1:4001
          ci/annotate.sh vinyl-ddltest python3 tests/sql/ddltest.py --tarn 127.0.0.1:4000,127.0.0.1:4001 --kv 127.0.0.1:3311,127.0.0.1:3321 --seconds 20
          ci/annotate.sh vinyl-lazytest python3 tests/sql/lazytest.py --tarn 127.0.0.1:4000 --kv 127.0.0.1:3311,127.0.0.1:3321 --ref 127.0.0.1:3407 --engine vinyl
          ci/annotate.sh vinyl-lazyfaults python3 tests/sql/lazyfaults.py --tarn 127.0.0.1:4000 --shards 127.0.0.1:3311,127.0.0.1:3321 --engine vinyl
          if grep -h "yielded inside" /tmp/tarn-cluster/*.log; then echo "::error title=vinyl::an atomic section yielded"; exit 1; fi
          if grep -h "lock copy differs" /tmp/tarn-cluster/*.log; then
            echo "::error title=locks::the native module's copy of the lock index differed from it"; exit 1
          fi
      - name: Vinyl admission and overload latency
        run: |
          scripts/cluster.sh stop
          TARN_VINYL_MEMORY_MB=8 TARN_VINYL_CACHE_MB=0 TARN_VINYL_TIMEOUT=0.25 TARN_TEST_HOOKS=1 \
            scripts/cluster.sh start -n 2 -r 1 -p 4000 -s 2
          ci/annotate.sh vinylpressure python3 tests/sql/vinylpressure.py \
            --tarn 127.0.0.1:4000,127.0.0.1:4001 --shards 127.0.0.1:3311,127.0.0.1:3321 \
            --require-native --real-pressure
          scripts/cluster.sh stop
      - name: Bounded RPC admission and blackholed established connections
        run: |
          ci/annotate.sh rpcs tests/rpcs.sh
          TARN_NATIVE=0 ci/annotate.sh rpcs-lua tests/rpcs.sh
          ENGINE=vinyl ci/annotate.sh rpcs-vinyl tests/rpcs.sh
      - name: Fault injection
        env:
          TARN_TOPOLOGY_LIMITS: '{"max_connections":20,"completion_connections":4,"idle_secs":1,"fanout":2,"active_branches":8,"queued_branches":32,"stats_shards_per_tick":2}'
        run: |
          TARN_CHECK_LOCKS=1 ci/annotate.sh faults tests/faults.sh
          TARN_NATIVE=0 ci/annotate.sh faults-lua tests/faults.sh
          TARN_FAULT_REPLY=invalid-type ci/annotate.sh faults-invalid-reply tests/faults.sh
          TARN_NATIVE=0 TARN_FAULT_REPLY=invalid-type ci/annotate.sh faults-invalid-reply-lua tests/faults.sh
          TARN_FAULT_REPLY=oversized-frame ci/annotate.sh faults-response-limit tests/faults.sh
          TARN_NATIVE=0 TARN_FAULT_REPLY=oversized-frame ci/annotate.sh faults-response-limit-lua tests/faults.sh
          ENGINE=vinyl TARN_FAULT_REPLY=oversized-frame ci/annotate.sh faults-response-limit-vinyl tests/faults.sh
          ci/annotate.sh ddlfaults tests/ddlfaults.sh
          ci/annotate.sh movefaults tests/movefaults.sh
          ci/annotate.sh joinfaults tests/joinfaults.sh
      - name: Bucket count of new and older clusters
        run: ci/annotate.sh bucketcount tests/bucketcount.sh
      - name: A shard joins under load
        env:
          TARN_TOPOLOGY_LIMITS: '{"max_connections":20,"completion_connections":4,"idle_secs":1,"fanout":2,"active_branches":8,"queued_branches":32,"stats_shards_per_tick":2}'
        run: |
          ci/annotate.sh jointest tests/jointest.sh
          R=3 ENGINE=vinyl DIR=/tmp/tarn-join-vinyl ci/annotate.sh vinyl-jointest tests/jointest.sh
      - name: Grow from 2 shards to 4 and shrink to 3 under load
        env:
          TARN_TOPOLOGY_LIMITS: '{"max_connections":20,"completion_connections":4,"idle_secs":1,"fanout":2,"active_branches":8,"queued_branches":32,"stats_shards_per_tick":2}'
        run: SECS=45 ci/annotate.sh growshrink tests/growshrink.sh
      - name: Failover (2 shards x 3 replicas)
        env:
          TARN_TOPOLOGY_LIMITS: '{"max_connections":20,"completion_connections":4,"idle_secs":1,"fanout":2,"active_branches":8,"queued_branches":32,"stats_shards_per_tick":2}'
        run: SECS=45 TARN_CHECK_LOCKS=1 ci/annotate.sh failover tests/failover.sh
      - name: Fault injection and failover with vinyl tables
        env:
          TARN_TOPOLOGY_LIMITS: '{"max_connections":20,"completion_connections":4,"idle_secs":1,"fanout":2,"active_branches":8,"queued_branches":32,"stats_shards_per_tick":2}'
        run: |
          ENGINE=vinyl TARN_CHECK_LOCKS=1 ci/annotate.sh vinyl-faults tests/faults.sh
          ENGINE=vinyl TARN_CHECK_LOCKS=1 TARN_FAULT_REPLY=invalid-type ci/annotate.sh vinyl-faults-invalid-reply tests/faults.sh
          ENGINE=vinyl SECS=45 TARN_CHECK_LOCKS=1 DIR=/tmp/tarn-failover-vinyl ci/annotate.sh vinyl-failover tests/failover.sh
      - name: Strong KV paired SQL histories and RF3 faults
        run: |
          python3 tests/test_kv_control.py
          ci/annotate.sh strong-kv tests/kv.sh
          TARN_NATIVE=0 ci/annotate.sh strong-kv-lua tests/kv.sh
      - name: Retain strong KV histories and fixture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: strong-kv-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/tarn-kv181-*/source.json
            /tmp/tarn-kv181-*/owner.json
            /tmp/tarn-kv181-*/manifest.json
            /tmp/tarn-kv181-*/processes.jsonl
            /tmp/tarn-kv181-*/lifecycle.json
            /tmp/tarn-kv181-*/preflight.json
            /tmp/tarn-kv181-*/broker-preflight.json
            /tmp/tarn-kv181-*/*.log
            /tmp/tarn-kv181-*/functional/*
            /tmp/tarn-kv181-*/faults/*
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain integrity outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: integrity-evidence
          retention-days: 30
      - name: Retain Vinyl pressure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vinyl-pressure-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/tarn-vinylpressure-*/*
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain cluster backup and restore evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cluster-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/tarn-cluster-backup-*.json
            /tmp/tarn-cluster-backup-*/*.log
            /tmp/tarn-cluster-backup-*/backup/*.json
            /tmp/tarn-cluster-backup-*/restore/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Cluster logs
        if: failure()
        run: |
          for f in /tmp/tarn-cluster/*.log /tmp/tarn-cluster/*/*.log /tmp/tarn-failover*/*.log /tmp/tarn-failover*/*/*.log /tmp/tarn-ddlfaults/*.log /tmp/tarn-movefaults/*.log /tmp/tarn-bucketcount/*.log /tmp/tarn-join*/*.log /tmp/tarn-growshrink/*.log; do
            [ -f "$f" ] && { echo "::group::$f"; tail -n 60 "$f"; echo "::endgroup::"; }
          done
          for f in /tmp/tarn-lazyfaults-*/manifest.json /tmp/tarn-lazyfaults-*/events.jsonl; do
            [ -f "$f" ] && { echo "::group::$f"; tail -n 60 "$f"; echo "::endgroup::"; }
          done
          for f in /tmp/tarn-vinylpressure-*/manifest.json /tmp/tarn-vinylpressure-*/events.jsonl /tmp/tarn-vinylpressure-*/pressure-summary.json; do
            [ -f "$f" ] && { echo "::group::$f"; tail -n 60 "$f"; echo "::endgroup::"; }
          done
          true
      - name: Retain native freshness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-freshness-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            /tmp/tarn-lua-test.*/native-freshness-*/events.jsonl
            /tmp/tarn-lua-test.*/native-freshness-*/source.sha256
            /tmp/tarn-lua-test.*/native-freshness-*/native.sha256
            /tmp/tarn-lua-test.*/native-freshness-*/tarantool.sha256
            /tmp/tarn-lua-test.*/native-freshness-*/tarantool-version.txt
            /tmp/tarn-lua-test.*/native-freshness-*/control
            /tmp/tarn-lua-test.*/native-freshness-*/cleanup.txt
            /tmp/tarn-lua-test.*/native-freshness-*/s*.process-identity
            /tmp/tarn-lua-test.*/native-freshness-*/s*.pid
            /tmp/tarn-lua-test.*/native-freshness-*/s*.log
            /tmp/tarn-lua-test.*/native-freshness-*/s*/status-events.jsonl

  upgrade:
    if: github.event_name != 'workflow_dispatch' || (!inputs.strong_read_cost && !inputs.topology_only)
    name: Rolling upgrade (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [memtx, vinyl]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install PyMySQL
      - name: Restore Tarantool
        uses: actions/cache/restore@v6
        with:
          path: ~/.local/tarantool
          key: tarantool-${{ env.TARANTOOL_VERSION }}-${{ runner.os }}-${{ hashFiles('ci/install-tarantool.sh') }}
      - name: Install Tarantool
        run: |
          ci/install-tarantool.sh "$TARANTOOL_VERSION" "$HOME/.local/tarantool"
          echo "$HOME/.local/tarantool/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - name: Reject changed upgrade build receipts
        run: python3 tests/test_upgrade_build_receipt.py
      - name: Upgrade, mixed components, refusal and rollback
        run: ENGINE=${{ matrix.engine }} bash tests/rolling_upgrade.sh
      - name: Retain upgrade evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rolling-upgrade-${{ matrix.engine }}
          path: |
            /tmp/tarn-upgrade-build.*/old-build.log
            /tmp/tarn-upgrade-build.*/new-build.log
            /tmp/tarn-upgrade-build.*/artifacts/
            /tmp/tarn-upgrade-build.*/old-native/
            /tmp/tarn-upgrade-build.*/new-native/
            /tmp/tarn-upgrade-build.*/results/
          retention-days: 30

  tla:
    if: github.event_name != 'workflow_dispatch' || (!inputs.strong_read_cost && !inputs.topology_only)
    name: TLA+ model checking
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Download the TLA+ tools
        run: curl -fsSL -o tla/tla2tools.jar "$TLA_TOOLS_URL"
      - name: Check the fast configurations
        run: WORKERS=auto tla/check.sh

  verus:
    if: github.event_name != 'workflow_dispatch' || (!inputs.strong_read_cost && !inputs.topology_only)
    name: Verus proofs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust toolchain of the Verus release
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Download Verus
        run: |
          curl -fsSL -o verus.zip "https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q verus.zip -d "$HOME/verus"
      - name: Verify
        working-directory: crates/tarn-verified
        run: |
          "$HOME/verus/verus-x86-linux/verus" --crate-type=lib src/lib.rs 2>&1 | tee verus.log
          grep -qE "verification results:: [0-9]+ verified, 0 errors" verus.log

  strong-read-cost:
    if: github.event_name == 'workflow_dispatch' && inputs.strong_read_cost
    uses: ./.github/workflows/strong-read-cost.yml
    permissions:
      contents: read

  topology:
    if: github.event_name == 'workflow_dispatch' && inputs.topology_only
    uses: ./.github/workflows/topology.yml
    permissions:
      contents: read
  file-backup-scale:
    if: github.event_name == 'workflow_dispatch' && inputs.file_backup_scale
    uses: ./.github/workflows/file-backup.yml
    with:
      size_gib: ${{ inputs.backup_size_gib }}
      repetitions: '3'
      rate_mib: '128'
