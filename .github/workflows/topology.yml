name: Gateway topology bounds
on:
  pull_request:
    paths:
      - 'crates/tarn-iproto/**'
      - 'crates/tarn-sql/**'
      - 'tests/topology.sh'
      - 'tests/sql/topologytest.py'
      - '.github/workflows/topology.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: topology-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        groups: [8, 32, 128]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install PyMySQL
      - uses: actions/cache@v6
        with:
          path: ~/.local/tarantool
          key: tarantool-3.9.0-${{ runner.os }}-${{ hashFiles('ci/install-tarantool.sh') }}
      - run: |
          ci/install-tarantool.sh 3.9.0 "$HOME/.local/tarantool"
          echo "$HOME/.local/tarantool/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --locked -p tarn-server -p tarn-storage
      - name: Retain release binaries and source identity
        run: |
          mkdir -p /tmp/topology-evidence
          git rev-parse HEAD > /tmp/topology-evidence/source.txt
          sha256sum target/release/tarn-server target/release/libtarn_storage.so > /tmp/topology-evidence/binaries.txt
      - uses: actions/upload-artifact@v6
        with:
          name: topology-release-${{ matrix.groups }}
          path: |
            target/release/tarn-server
            target/release/libtarn_storage.so
            /tmp/topology-evidence/source.txt
            /tmp/topology-evidence/binaries.txt
      - name: Real shards, two gateways, bounded point and scatter reads
        env:
          GROUPS_COUNT: ${{ matrix.groups }}
          TOPOLOGY_WORK: /tmp/topology-work
          TOPOLOGY_OUT: /tmp/topology-evidence
        run: bash tests/topology.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: topology-results-${{ matrix.groups }}
          path: |
            /tmp/topology-evidence
            /tmp/topology-work/storage/*.log
            /tmp/topology-work/storage/cluster.json
