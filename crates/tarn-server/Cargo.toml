[package]
name = "tarn-server"
description = "Tarn: a distributed, strictly serializable MySQL-compatible SQL server on Tarantool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "tarn-server"
path = "src/main.rs"

[dependencies]
tarn-transport.workspace = true
tarn-iproto.workspace = true
serde = { version = "1", features = ["derive"] }
tarn-common.workspace = true
tarn-mysql.workspace = true
tarn-sql.workspace = true
tokio.workspace = true
tracing.workspace = true
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mimalloc = { version = "0.1", default-features = false }
